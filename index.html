<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tamil Nadu Matrimony</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffaf5;
            text-align: center;
        }

        header {
            background: #8b1538;
            color: white;
            padding: 25px;
        }

        h1 {
            margin: 0;
        }

        .hero {
            padding: 70px 15px;
        }

        .hero h2 {
            color: #8b1538;
            font-size: 30px;
        }

        .hero p {
            color: #555;
            font-size: 18px;
        }

        button {
            background: #8b1538;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 16px;
        }

        footer {
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>Tamil Nadu Matrimony</h1>
        <p>Find Your Perfect Life Partner</p>
    </header>

    <section class="hero">
        <h2>Welcome to Tamil Nadu Matrimony</h2>

        <p>Start your journey towards a beautiful relationship.</p>

        <button onclick="showMessage()">
            Get Started
        </button>

        <p id="message"></p>
    </section>

    <footer>
        © 2026 Tamil Nadu Matrimony
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").innerText =
                "Welcome! Registration is coming soon.";
        }
    </script>

</body>
</html>
